<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="310" viewBox="0 0 1500 310" role="img" aria-labelledby="title desc">
  <title id="title">BITWIKIORG ASCII banner</title>
  <desc id="desc">ASCII styled BITWIKIORG banner using blue brand tones and layered retro depth.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
