<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">BITwiki signal manifold</title>
  <desc id="desc">A dark terminal-inspired geometric manifold representing persistent state, initialization, capability, runtime interoperability, coordination, and knowledge.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07090f"/>
      <stop offset="0.52" stop-color="#0d1020"/>
      <stop offset="1" stop-color="#090b12"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f8f8f2" stop-opacity="0.92"/>
      <stop offset="0.16" stop-color="#8be9fd" stop-opacity="0.72"/>
      <stop offset="0.48" stop-color="#bd93f9" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#bd93f9" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8be9fd"/>
      <stop offset="0.5" stop-color="#bd93f9"/>
      <stop offset="1" stop-color="#ff79c6"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#8be9fd" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="358" rx="17" fill="none" stroke="#6272a4" stroke-opacity="0.48"/>
  <rect width="1200" height="360" rx="18" fill="url(#grid)"/>

  <g opacity="0.8">
    <path d="M32 58H220L246 32H424" fill="none" stroke="#8be9fd" stroke-opacity="0.34"/>
    <path d="M776 32H954L980 58H1168" fill="none" stroke="#ff79c6" stroke-opacity="0.34"/>
    <path d="M32 302H220L246 328H424" fill="none" stroke="#bd93f9" stroke-opacity="0.28"/>
    <path d="M776 328H954L980 302H1168" fill="none" stroke="#f1fa8c" stroke-opacity="0.24"/>
    <circle cx="32" cy="58" r="3" fill="#8be9fd"/>
    <circle cx="1168" cy="58" r="3" fill="#ff79c6"/>
    <circle cx="32" cy="302" r="3" fill="#bd93f9"/>
    <circle cx="1168" cy="302" r="3" fill="#f1fa8c"/>
  </g>

  <g transform="translate(600 180)">
    <ellipse rx="232" ry="108" fill="none" stroke="#6272a4" stroke-opacity="0.52" stroke-width="1.3"/>
    <ellipse rx="198" ry="136" fill="none" stroke="#bd93f9" stroke-opacity="0.42" stroke-width="1.2" transform="rotate(30)"/>
    <ellipse rx="198" ry="136" fill="none" stroke="#8be9fd" stroke-opacity="0.36" stroke-width="1.2" transform="rotate(-30)"/>
    <rect x="-136" y="-136" width="272" height="272" rx="18" fill="none" stroke="#ff79c6" stroke-opacity="0.24" transform="rotate(45)"/>
    <circle r="76" fill="url(#core)" opacity="0.46" filter="url(#soft)"/>

    <g stroke="url(#signal)" stroke-opacity="0.72" fill="none">
      <path d="M-260 0H-156"/>
      <path d="M156 0H260"/>
      <path d="M0-148V-114"/>
      <path d="M0 114V148"/>
      <path d="M-178-86L-124-60"/>
      <path d="M178-86L124-60"/>
      <path d="M-178 86L-124 60"/>
      <path d="M178 86L124 60"/>
    </g>

    <g fill="#0d1020" stroke-width="1.5">
      <circle cx="-260" cy="0" r="7" stroke="#8be9fd"/>
      <circle cx="260" cy="0" r="7" stroke="#ff79c6"/>
      <circle cx="0" cy="-148" r="6" stroke="#bd93f9"/>
      <circle cx="0" cy="148" r="6" stroke="#f1fa8c"/>
      <circle cx="-178" cy="-86" r="5" stroke="#8be9fd"/>
      <circle cx="178" cy="-86" r="5" stroke="#ff79c6"/>
      <circle cx="-178" cy="86" r="5" stroke="#bd93f9"/>
      <circle cx="178" cy="86" r="5" stroke="#f1fa8c"/>
    </g>

    <circle r="44" fill="#080b12" stroke="url(#signal)" stroke-width="2.2" filter="url(#glow)"/>
    <circle r="23" fill="none" stroke="#f8f8f2" stroke-opacity="0.7"/>
    <circle r="6" fill="#f8f8f2" filter="url(#glow)"/>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" text-anchor="middle">
    <text x="600" y="46" fill="#8be9fd" font-size="12" letter-spacing="4" opacity="0.88">CORE SIGNAL MANIFOLD // PUBLIC VECTOR</text>
    <text x="600" y="167" fill="#f8f8f2" font-size="47" font-weight="700" letter-spacing="12">BITWIKI</text>
    <text x="600" y="201" fill="#bd93f9" font-size="14" font-weight="600" letter-spacing="5">PERSISTENT AGENT SYSTEMS</text>
    <text x="600" y="229" fill="#c5c8d8" font-size="11" letter-spacing="2.7">STATE · INITIALIZATION · CAPABILITY · INTEROPERABILITY</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="10" letter-spacing="1.5" fill="#8991aa">
    <text x="42" y="45">λ::INIT</text>
    <text x="1070" y="45">Ξ::RUNTIME</text>
    <text x="42" y="326">Σ::STATE</text>
    <text x="1032" y="326">Ω::KNOWLEDGE</text>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, Liberation Mono, monospace" font-size="9" letter-spacing="1.4" fill="#6272a4" text-anchor="middle">
    <text x="600" y="344">THE RUNTIME ENDS // STATE SURVIVES // KNOWLEDGE COMPOUNDS</text>
  </g>
</svg>
